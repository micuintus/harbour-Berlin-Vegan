buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // AGP 8.0.2: last version before android.bundle.enableUncompressedNativeLibs
        // was removed (removed in 8.1). Felgo's androiddeployqt injects that property
        // unconditionally, so we pin to a version that still accepts it.
        classpath "com.android.tools.build:gradle:8.0.2"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://install.felgo.com/maven/' }
    }
}

apply plugin: 'com.android.application'

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation "androidx.appcompat:appcompat:1.2.0"
}

android {
    // namespace required by AGP 8.x; androidPackageName is set by androiddeployqt
    namespace              androidPackageName
    // Compile against SDK 34: AGP 8.0.2 was tested up to 33 but handles 34 fine.
    // SDK 35's android.jar uses a new format that AGP 8.0.2's aapt2 cannot parse.
    compileSdkVersion    34
    buildToolsVersion    androidBuildToolsVersion

    compileOptions {
      sourceCompatibility 1.8
      targetCompatibility 1.8
    }

    defaultConfig {
      multiDexEnabled true
      // Target the actual device SDK via the Qt-provided variable (plain integer)
      targetSdkVersion   qtTargetSdkVersion.toInteger()
      // productIdentifier only exists in the Felgo --gradle path; fall back to
      // androidPackageName which is always set by androiddeployqt
      applicationId    = project.hasProperty("productIdentifier") ? productIdentifier : androidPackageName
      versionCode      = project.hasProperty("productVersionCode") ? productVersionCode.toInteger() : 37
      versionName      = project.hasProperty("productVersionName") ? productVersionName : "3.7.0"
      minSdkVersion    = project.hasProperty("qtMinSdkVersion") ? qtMinSdkVersion.toInteger() : 28
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = [qt5AndroidDir + '/src', 'src', 'java']
            aidl.srcDirs = [qt5AndroidDir + '/src', 'src', 'aidl']
            res.srcDirs = [qt5AndroidDir + '/res', 'res']
            resources.srcDirs = ['src']
            renderscript.srcDirs = ['src']
            assets.srcDirs = ['assets']
            jniLibs.srcDirs = ['libs']
       }
    }

    lintOptions {
        abortOnError false
    }
    aaptOptions { // Do not compress Qt binary resources file
        noCompress 'rcc'
    }
    tasks.withType(JavaCompile) {
        options.incremental = true
    }

}
