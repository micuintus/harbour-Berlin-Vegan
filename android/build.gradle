// Based on Felgo's own templates/build.gradle. Keep it close to that file so
// SDK updates stay cheap; the deltas are the Felgo maven repo, the product
// identity wiring, and the target SDK.

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        //noinspection AndroidGradlePluginVersion
        classpath 'com.android.tools.build:gradle:8.6.0'
    }
}

repositories {
    google()
    mavenCentral()
    maven { url 'https://install.felgo.com/maven/' }
}

apply plugin: qtGradlePluginType

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
    //noinspection GradleDependency
    implementation 'androidx.core:core:1.13.1'
}

android {
    namespace androidPackageName
    compileSdkVersion androidCompileSdkVersion
    buildToolsVersion androidBuildToolsVersion
    ndkVersion androidNdkVersion

    // Extract native libraries from the APK
    packagingOptions.jniLibs.useLegacyPackaging true

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = [qtAndroidDir + '/src', 'src', 'java']
            aidl.srcDirs = [qtAndroidDir + '/src', 'src', 'aidl']
            res.srcDirs = [qtAndroidDir + '/res', 'res']
            resources.srcDirs = ['resources']
            renderscript.srcDirs = ['src']
            assets.srcDirs = ['assets']
            jniLibs.srcDirs = ['libs']
       }
    }

    tasks.withType(JavaCompile) {
        options.incremental = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lintOptions {
        abortOnError false
    }

    // Do not compress Qt binary resources file
    aaptOptions {
        noCompress 'rcc'
    }

    defaultConfig {
        resConfig "en"
        multiDexEnabled true
        minSdkVersion qtMinSdkVersion
        // Qt still reports 35; Play requires 36 for uploads from 2026-08-31.
        targetSdkVersion 36
        ndk.abiFilters = qtTargetAbiList.split(",")

        // productIdentifier only exists on the Felgo --gradle path;
        // androidPackageName is always set by androiddeployqt.
        applicationId = project.hasProperty("productIdentifier") ? productIdentifier : androidPackageName
        versionCode   = project.hasProperty("productVersionCode") ? productVersionCode.toInteger() : 37
        versionName   = project.hasProperty("productVersionName") ? productVersionName : "3.7.0"
    }
}
