# QMapLibre 4 for Android and the Kirigami APK, built from source.
#
# Qt comes from official prebuilds only: the Android kit for target libraries,
# a same-version desktop install for host tools (QT_HOST_PATH). The desktop
# install must be complete (no archives= filter): the Android kit carries no
# host-tools CMake packages (Qt6QmlTools etc.).
#
# All external prefixes must be registered in BOTH CMAKE_PREFIX_PATH and
# CMAKE_FIND_ROOT_PATH: Qt's Android toolchain re-roots package searches
# (CMAKE_FIND_ROOT_PATH_MODE_PACKAGE=ONLY) and silently ignores prefixes
# outside the root set.
#
# 16 KB pages: Google Play requires 16 KB alignment for apps targeting
# Android 15+. NDK r27 needs -DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON; r28+
# aligns by default. Verified: LOAD align 0x4000 via llvm-readelf.

name: qmaplibre-android

on:
  workflow_dispatch:
  push:
    branches: [feature/application_revamp]

jobs:
  qmaplibre:
    runs-on: ubuntu-latest
    outputs:
      prefix: ${{ steps.prefix.outputs.path }}
    steps:
      - uses: actions/checkout@v4

      - name: Install host Qt (Linux desktop)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: linux

      - name: Install Qt (Android arm64)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: linux
          target: android
          arch: android_arm64_v8a
          modules: qtlocation qtpositioning

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c

      # qt-cmake via the kit toolchain; Widgets component is on because the
      # Felgo track's FelgoConfig find_package demands QMapLibreWidgets.
      - name: Build QMapLibre 4 (OpenGL backend)
        id: prefix
        run: |
          git clone --recursive https://github.com/maplibre/maplibre-native-qt.git extern/qmaplibre
          # qt-cmake is the kit's own wrapper: it embeds the Android toolchain
          # and CMAKE_PREFIX_PATH, which manual wiring gets subtly wrong.
          cmake -B build-ql -S extern/qmaplibre -GNinja \
            -DCMAKE_TOOLCHAIN_FILE="$QT_ROOT_DIR/lib/cmake/Qt6/qt.toolchain.cmake" \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DQT_HOST_PATH="$(dirname "$QT_ROOT_DIR")/gcc_64" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/qmaplibre-prefix" \
            -DMLN_WITH_OPENGL=ON \
            -DMLN_QT_WITH_WIDGETS=ON \
            -DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON
          cmake --build build-ql
          cmake --install build-ql
          echo "path=$RUNNER_TEMP/qmaplibre-prefix" >> "$GITHUB_OUTPUT"
        env:
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}

      - name: Verify 16 KB alignment
        run: |
          READELF=$(find "$ANDROID_NDK_ROOT" -name llvm-readelf | head -1)
          fail=0
          for so in $(find "$RUNNER_TEMP/qmaplibre-prefix" -name '*.so'); do
            align=$("$READELF" -l "$so" | grep -m1 LOAD | grep -oE '0x[0-9a-f]+$')
            echo "$so: LOAD align $align"
            [ "$align" = "0x4000" ] || fail=1
          done
          exit $fail
        env:
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}

      - uses: actions/upload-artifact@v4
        with:
          name: qmaplibre-android-arm64
          path: ${{ steps.prefix.outputs.path }}

  kf6-prefix:
    runs-on: ubuntu-latest
    outputs:
      prefix: ${{ steps.prefix.outputs.path }}
    steps:
      - name: Install host Qt (Linux desktop)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: linux

      - name: Install Qt (Android arm64)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: linux
          target: android
          arch: android_arm64_v8a
          modules: qtlocation qtpositioning qtshadertools

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c

      # ECM is host-side CMake machinery: plain install, no Android toolchain.
      - name: Install extra-cmake-modules (host)
        run: |
          git clone --depth 1 --branch v6.18.0 https://invent.kde.org/frameworks/extra-cmake-modules.git
          cmake -B ecm-build -S extra-cmake-modules -GNinja \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/kf6-prefix" \
            -DBUILD_TESTING=OFF
          cmake --install ecm-build

      # Kirigami uses Qt private headers, so it must be cross-built against
      # the exact kit the app uses. The KF6 prefix is in CMAKE_FIND_ROOT_PATH
      # because Qt's Android toolchain ignores prefixes outside the root set.
      - name: Build Kirigami (Android arm64)
        id: prefix
        run: |
          export PATH="$QT_ROOT_DIR/../gcc_64/bin:$QT_ROOT_DIR/bin:$PATH"
          git clone --depth 1 --branch v6.18.0 https://invent.kde.org/frameworks/kirigami.git
          cmake -B kirigami-build -S kirigami -GNinja \
            -DCMAKE_TOOLCHAIN_FILE="$QT_ROOT_DIR/lib/cmake/Qt6/qt.toolchain.cmake" \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DCMAKE_FIND_ROOT_PATH="$QT_ROOT_DIR;$RUNNER_TEMP/kf6-prefix" \
            -DQT_HOST_PATH="$QT_ROOT_DIR/../gcc_64" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DCMAKE_MODULE_PATH="$RUNNER_TEMP/kf6-prefix/share/ECM/cmake" \
            -DECM_DIR="$RUNNER_TEMP/kf6-prefix/share/ECM/cmake" \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/kf6-prefix" \
            -DBUILD_TESTING=OFF \
            -DBUILD_EXAMPLES=OFF
          cmake --build kirigami-build
          cmake --install kirigami-build
          echo "path=$RUNNER_TEMP/kf6-prefix" >> "$GITHUB_OUTPUT"
        env:
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}

      - uses: actions/upload-artifact@v4
        with:
          name: kf6-android-prefix
          path: ${{ steps.prefix.outputs.path }}

  # Runs on workflow_dispatch only until it passes device testing; pushes
  # exercise the two prefix jobs.
  kirigami-apk:
    if: github.event_name == 'workflow_dispatch'
    needs: [qmaplibre, kf6-prefix]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: qmaplibre-android-arm64
          path: qmaplibre-prefix

      - uses: actions/download-artifact@v4
        with:
          name: kf6-android-prefix
          path: kf6-prefix

      - name: Install host Qt (Linux desktop)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: linux

      - name: Install Qt (Android arm64)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: linux
          target: android
          arch: android_arm64_v8a
          modules: qtlocation qtpositioning qtshadertools

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c

      - name: Build Kirigami APK
        run: |
          QOFF="$QT_ROOT_DIR"
          KP="$PWD/kf6-prefix"
          QLP="$PWD/qmaplibre-prefix"
          cmake -B build -S . -GNinja \
            -DBV_PLATFORM=kirigami \
            -DCMAKE_TOOLCHAIN_FILE="$QOFF/lib/cmake/Qt6/qt.toolchain.cmake" \
            -DCMAKE_PREFIX_PATH="$QOFF;$KP;$QLP" \
            -DCMAKE_FIND_ROOT_PATH="$QOFF;$KP;$QLP" \
            -DQT_HOST_PATH="$(dirname "$QT_ROOT_DIR")/gcc_64" \
            -DKF6_ANDROID_PREFIX="$KP" \
            -DQMapLibre_DIR="$QLP/lib/cmake/QMapLibre" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target harbour-berlin-vegan
          cmake --build build --target harbour-berlin-vegan_prepare_apk_dir
        env:
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_HOME: ${{ env.ANDROID_HOME || '/usr/local/lib/android/sdk' }}

      - name: Assemble and sign APK
        id: assemble
        env:
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          HOSTQT="$(dirname "$QT_ROOT_DIR")/gcc_64"
          "$HOSTQT/bin/androiddeployqt" \
            --input build/android-harbour-berlin-vegan-deployment-settings.json \
            --output build/android-build \
            --android-platform android-35 \
            --gradle
          APK=build/android-build/harbour-berlin-vegan.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.keystore
            "$BT/zipalign" -f 4 "$APK" aligned.apk
            "$BT/apksigner" sign \
              --ks release.keystore \
              --ks-pass pass:"$KEYSTORE_PASS" \
              --ks-key-alias "$KEY_ALIAS" \
              --out berlin-vegan-kirigami.apk aligned.apk
            echo "apk=berlin-vegan-kirigami.apk" >> "$GITHUB_OUTPUT"
          else
            echo "apk=$APK" >> "$GITHUB_OUTPUT"
            echo "::notice::No RELEASE_KEYSTORE_B64 secret; uploading unsigned APK"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: berlin-vegan-kirigami-apk
          path: ${{ steps.assemble.outputs.apk }}
